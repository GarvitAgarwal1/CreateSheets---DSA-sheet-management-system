services:
  redis:
    container_name: createsheets-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - createsheets

  backend:
    container_name: createsheets-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      MONGODB_URI: ${MONGODB_URI}
      MONGO_STARTUP_PING_ENABLED: ${MONGO_STARTUP_PING_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      APP_AUTH_SECRET: ${APP_AUTH_SECRET}
      APP_AUTH_EXPIRATION_SECONDS: ${APP_AUTH_EXPIRATION_SECONDS:-604800}
      APP_AUTH_GOOGLE_CLIENT_ID: ${APP_AUTH_GOOGLE_CLIENT_ID:-}
      APP_AUTH_GOOGLE_CLIENT_IDS: ${APP_AUTH_GOOGLE_CLIENT_IDS:-}
      APP_AUTH_OTP_BYPASS_KEY: ${APP_AUTH_OTP_BYPASS_KEY:-}
      APP_CORS_ALLOWED_ORIGINS: https://www.createsheets.com,https://createsheets.com,https://api.createsheets.com
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ""
      ADMIN_USERNAME: ${ADMIN_USERNAME:-CreateSheets}
      APP_QUEUE_PROCESSING_DELAY_MS: ${APP_QUEUE_PROCESSING_DELAY_MS:-350}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_MAIL_HOST: ${APP_MAIL_HOST:-}
      APP_MAIL_PORT: ${APP_MAIL_PORT:-587}
      APP_MAIL_USERNAME: ${APP_MAIL_USERNAME:-}
      APP_MAIL_PASSWORD: ${APP_MAIL_PASSWORD:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      APP_MAIL_FROM_NAME: "${APP_MAIL_FROM_NAME:-Create Sheets}"
      APP_MAIL_AUTH: ${APP_MAIL_AUTH:-true}
      APP_MAIL_STARTTLS: ${APP_MAIL_STARTTLS:-true}
      APP_FEEDBACK_TO: ${APP_FEEDBACK_TO:-}
      APP_PAYMENT_RAZORPAY_ENABLED: ${APP_PAYMENT_RAZORPAY_ENABLED:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      APP_CACHE_PUBLIC_TTL_SECONDS: ${APP_CACHE_PUBLIC_TTL_SECONDS:-300}
      APP_CACHE_PRIVATE_TTL_SECONDS: ${APP_CACHE_PRIVATE_TTL_SECONDS:-120}
      APP_CACHE_SWR_STALE_TTL_SECONDS: ${APP_CACHE_SWR_STALE_TTL_SECONDS:-60}
      APP_CACHE_SWR_HARD_TTL_SECONDS: ${APP_CACHE_SWR_HARD_TTL_SECONDS:-300}
      APP_CACHE_SWR_LOCK_TTL_SECONDS: ${APP_CACHE_SWR_LOCK_TTL_SECONDS:-10}
      APP_CACHE_SWR_RETRY_DELAY_MS: ${APP_CACHE_SWR_RETRY_DELAY_MS:-500}
      APP_CACHE_SWR_RETRY_COUNT: ${APP_CACHE_SWR_RETRY_COUNT:-1}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-18080}:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped
    networks:
      - createsheets

  frontend:
    container_name: createsheets-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_APP_API_BASE_URL: ""
        VITE_APP_AUTH_GOOGLE_CLIENT_ID: ${VITE_APP_AUTH_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
        VITE_APP_NAME: "${VITE_APP_NAME:-Create Sheets}"
        VITE_ADMIN_USERNAME: ${VITE_ADMIN_USERNAME:-CreateSheets}
        VITE_SITE_URL: https://www.createsheets.com
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    networks:
      - createsheets

networks:
  createsheets:
    driver: bridge

volumes:
  redis-data:
