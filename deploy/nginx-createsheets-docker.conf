# /etc/nginx/sites-available/createsheets.conf
# Host Nginx terminates HTTPS and proxies to the Docker containers bound on 127.0.0.1.

map $http_origin $createsheets_cors_origin {
    default "";
    "https://www.createsheets.com" $http_origin;
    "https://createsheets.com" $http_origin;
    "https://api.createsheets.com" $http_origin;
}

upstream createsheets_frontend_docker {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream createsheets_backend_docker {
    server 127.0.0.1:18080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name createsheets.com www.createsheets.com api.createsheets.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name createsheets.com;

    ssl_certificate /etc/letsencrypt/live/createsheets.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/createsheets.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.createsheets.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.createsheets.com;

    ssl_certificate /etc/letsencrypt/live/createsheets.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/createsheets.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /robots.txt {
        default_type text/plain;
        proxy_pass http://createsheets_frontend_docker;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms.txt {
        default_type text/plain;
        proxy_pass http://createsheets_frontend_docker;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms-full.txt {
        default_type text/plain;
        proxy_pass http://createsheets_frontend_docker;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        default_type application/xml;
        proxy_hide_header Content-Type;
        add_header Content-Type "application/xml" always;
        proxy_pass http://createsheets_frontend_docker;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap-static.xml {
        default_type application/xml;
        proxy_hide_header Content-Type;
        add_header Content-Type "application/xml" always;
        proxy_pass http://createsheets_frontend_docker;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap-public-sheets.xml {
        default_type application/xml;
        proxy_pass http://createsheets_backend_docker;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $createsheets_cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, PATCH, DELETE" always;
            add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Origin" always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Vary "Origin" always;
            add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Content-Length 0 always;
            return 204;
        }

        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;

        proxy_pass http://createsheets_backend_docker;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ~ ^/(dashboard|admin|settings|profile|account|private|login|signup|register|forgot-password|reset-password|verify|me|auth|oauth|mysheets|notifications|alerts|alarms|import|export|learning-insights|premium|feedback)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
        proxy_pass http://createsheets_frontend_docker;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://createsheets_frontend_docker;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.createsheets.com;

    ssl_certificate /etc/letsencrypt/live/api.createsheets.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.createsheets.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / {
        default_type application/json;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
        return 200 '{"service":"createsheets-api","status":"ok"}';
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $createsheets_cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin" always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Vary "Origin" always;
            add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
            add_header Content-Length 0 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            return 204;
        }

        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;

        proxy_pass http://createsheets_backend_docker;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
