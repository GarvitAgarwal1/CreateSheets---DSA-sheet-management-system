# /etc/nginx/sites-available/createsheets.conf
# HTTPS frontend with API reverse proxy fallback.
server {
    listen 80;
    listen [::]:80;
    server_name createsheets.com www.createsheets.com;
    return 301 https://www.createsheets.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name createsheets.com;

    ssl_certificate /etc/letsencrypt/live/createsheets.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/createsheets.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.createsheets.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.createsheets.com;

    ssl_certificate /etc/letsencrypt/live/createsheets.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/createsheets.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/createsheets-frontend/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
    }

    location = /llms.txt {
        default_type text/plain;
        try_files /llms.txt =404;
    }

    location = /llms-full.txt {
        default_type text/plain;
        try_files /llms-full.txt =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files /sitemap.xml =404;
    }

    location = /sitemap-static.xml {
        default_type application/xml;
        try_files /sitemap-static.xml =404;
    }

    location = /sitemap-public-sheets.xml {
        default_type application/xml;
        proxy_pass http://localhost:8080/sitemap-public-sheets.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 0;
        try_files /index.html =404;
    }

    location = /sw.js {
        access_log off;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 0;
        try_files /sw.js =404;
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://www.createsheets.com" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, PATCH, DELETE" always;
            add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Origin" always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Content-Length 0 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin "https://www.createsheets.com" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, PATCH, DELETE" always;
        add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Origin" always;
        add_header Vary "Origin" always;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;

        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ~ ^/(dashboard|admin|settings|profile|account|private|login|signup|register|forgot-password|reset-password|verify|me|auth|oauth|mysheets|notifications|alerts|alarms|import|export|learning-insights|premium|feedback)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Dedicated API domain.
server {
    listen 80;
    listen [::]:80;
    server_name api.createsheets.com;
    return 301 https://api.createsheets.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.createsheets.com;

    ssl_certificate /etc/letsencrypt/live/api.createsheets.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.createsheets.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://www.createsheets.com" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin" always;
            add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        add_header Access-Control-Allow-Origin "https://www.createsheets.com" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, PATCH, DELETE" always;
        add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Accept, Origin" always;
        add_header Vary "Origin" always;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;

        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
