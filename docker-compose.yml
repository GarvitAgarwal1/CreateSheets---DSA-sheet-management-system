services:
  backend:
    container_name: createsheets-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/iqms}
      MONGO_STARTUP_PING_ENABLED: ${MONGO_STARTUP_PING_ENABLED:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      APP_AUTH_SECRET: ${APP_AUTH_SECRET:-change-this-dev-secret-before-real-use}
      APP_AUTH_GOOGLE_CLIENT_ID: ${APP_AUTH_GOOGLE_CLIENT_ID:-}
      APP_AUTH_GOOGLE_CLIENT_IDS: ${APP_AUTH_GOOGLE_CLIENT_IDS:-}
      APP_AUTH_OTP_BYPASS_KEY: ${APP_AUTH_OTP_BYPASS_KEY:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      APP_CACHE_PRIVATE_TTL_SECONDS: ${APP_CACHE_PRIVATE_TTL_SECONDS:-120}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-CreateSheets}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_MAIL_HOST: ${APP_MAIL_HOST:-smtp.gmail.com}
      APP_MAIL_PORT: ${APP_MAIL_PORT:-587}
      APP_MAIL_USERNAME: ${APP_MAIL_USERNAME:-}
      APP_MAIL_PASSWORD: ${APP_MAIL_PASSWORD:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      APP_MAIL_FROM_NAME: "${APP_MAIL_FROM_NAME:-Create Sheets}"
      APP_MAIL_AUTH: ${APP_MAIL_AUTH:-true}
      APP_MAIL_STARTTLS: ${APP_MAIL_STARTTLS:-true}
      APP_PAYMENT_RAZORPAY_ENABLED: ${APP_PAYMENT_RAZORPAY_ENABLED:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    ports:
      - "${BACKEND_HOST_PORT:-18080}:8080"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - createsheets

  frontend:
    container_name: createsheets-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_APP_API_BASE_URL: ${VITE_APP_API_BASE_URL:-}
        VITE_APP_AUTH_GOOGLE_CLIENT_ID: ${VITE_APP_AUTH_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
        VITE_APP_NAME: "${VITE_APP_NAME:-Create Sheets}"
        VITE_ADMIN_USERNAME: ${VITE_ADMIN_USERNAME:-CreateSheets}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - createsheets

  mongo:
    container_name: createsheets-mongo
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - createsheets

  redis:
    container_name: createsheets-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - createsheets

networks:
  createsheets:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
