upstream createsheets_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
    }

    location = /llms.txt {
        default_type text/plain;
        try_files /llms.txt =404;
    }

    location = /llms-full.txt {
        default_type text/plain;
        try_files /llms-full.txt =404;
    }

    location = /sitemap.xml {
        types {
            application/xml xml;
        }
        default_type application/xml;
        try_files /sitemap.xml =404;
    }

    location = /sitemap-static.xml {
        types {
            application/xml xml;
        }
        default_type application/xml;
        try_files /sitemap-static.xml =404;
    }

    location = /sitemap-public-sheets.xml {
        default_type application/xml;
        proxy_pass http://createsheets_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /sw.js {
        access_log off;
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        try_files /sw.js =404;
    }

    location ~* \.(?:css|js|mjs|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|eot)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
        proxy_pass http://createsheets_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ~ ^/(dashboard|admin|settings|profile|account|private|login|signup|register|forgot-password|reset-password|verify|me|auth|oauth|mysheets|notifications|alerts|alarms|import|export|learning-insights|premium|feedback)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
