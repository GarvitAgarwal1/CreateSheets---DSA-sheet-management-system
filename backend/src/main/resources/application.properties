spring.application.name=iqms-backend
server.port=8080
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/iqms}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://www.createsheets.com,https://createsheets.com,https://interactive-question-management-she-gamma.vercel.app}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app}
app.auth.secret=${APP_AUTH_SECRET}
app.auth.expiration-seconds=${APP_AUTH_EXPIRATION_SECONDS:604800}
app.auth.google-client-id=${APP_AUTH_GOOGLE_CLIENT_ID:}
app.auth.google-client-ids=${APP_AUTH_GOOGLE_CLIENT_IDS:}
app.auth.otp-bypass-key=${APP_AUTH_OTP_BYPASS_KEY:}
app.admin.username=${ADMIN_USERNAME:CreateSheets}

app.queue.processing-delay-ms=${APP_QUEUE_PROCESSING_DELAY_MS:350}

spring.mail.host=${APP_MAIL_HOST:}
spring.mail.port=${APP_MAIL_PORT:587}
spring.mail.username=${APP_MAIL_USERNAME:}
spring.mail.password=${APP_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${APP_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${APP_MAIL_STARTTLS:true}
spring.servlet.multipart.max-file-size=${APP_FEEDBACK_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${APP_FEEDBACK_MAX_REQUEST_SIZE:20MB}

app.mail.host=${APP_MAIL_HOST:}
app.mail.port=${APP_MAIL_PORT:587}
app.mail.username=${APP_MAIL_USERNAME:}
app.mail.password=${APP_MAIL_PASSWORD:}
app.mail.from-address=${APP_MAIL_FROM:${APP_MAIL_USERNAME:}}
app.mail.from-name=${APP_MAIL_FROM_NAME:IQMS}
app.mail.feedback-to=${APP_FEEDBACK_TO:krishna.awasthi.cse@gmail.com}
app.mail.auth=${APP_MAIL_AUTH:true}
app.mail.starttls=${APP_MAIL_STARTTLS:true}
app.mail.enabled=${APP_MAIL_ENABLED:false}

app.payment.razorpay.enabled=${APP_PAYMENT_RAZORPAY_ENABLED:false}
app.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

app.revision.intervals-hours=${APP_REVISION_INTERVALS_HOURS:6,24,72,168}

# Verifies MongoDB connectivity during application startup.
app.mongo.startup-ping-enabled=${MONGO_STARTUP_PING_ENABLED:true}

# Redis connection for SWR cache
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# Public cache policy for SEO/public read endpoints. Redis failures fail open to MongoDB.
app.cache.public-ttl-seconds=${APP_CACHE_PUBLIC_TTL_SECONDS:300}
# Private/authenticated sheet cache policy. Keys are user-scoped and invalidated on sheet/access mutations.
app.cache.private-ttl-seconds=${APP_CACHE_PRIVATE_TTL_SECONDS:120}

# Generic SWR cache policy
app.cache.swr.stale-ttl-seconds=${APP_CACHE_SWR_STALE_TTL_SECONDS:60}
app.cache.swr.hard-ttl-seconds=${APP_CACHE_SWR_HARD_TTL_SECONDS:300}
app.cache.swr.lock-ttl-seconds=${APP_CACHE_SWR_LOCK_TTL_SECONDS:10}
app.cache.swr.refresh-retry-delay-millis=${APP_CACHE_SWR_RETRY_DELAY_MS:500}
app.cache.swr.refresh-retry-count=${APP_CACHE_SWR_RETRY_COUNT:1}
app.cache.swr.lock-prefix=${APP_CACHE_SWR_LOCK_PREFIX:lock:swr}

# External API fetch template (example: https://api.example.com/users/{userId}/{resource})
app.external.resource-url-template=${APP_EXTERNAL_RESOURCE_URL_TEMPLATE:https://api.example.com/users/{userId}/{resource}}
app.external.auth-token=${APP_EXTERNAL_AUTH_TOKEN:}
